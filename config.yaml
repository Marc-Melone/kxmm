# kxmm — every knob lives here. DESIGN.md is the spec.
api:
  base_url: https://api.elections.kalshi.com/trade-api/v2
  rate_per_sec: 8            # local cap; public limit undocumented (DESIGN.md)
  timeout_s: 20
  max_attempts: 4            # backoff 1,2,4,8 s on 429/5xx
  tickers_batch: 50          # tickers per GET /markets?tickers=
record:
  book_poll_s: 10            # order book per market
  trades_poll_s: 30          # trades per market
  universe_refresh_s: 3600   # re-run selection hourly
  trades_backfill_s: 3600    # first trades poll for a new market looks back this far
  trades_max_pages: 20
  max_markets: 40
  max_per_event: 2
  shortlist_n: 150           # markets whose books are fetched for scoring each refresh
  gap_threshold_s: 300       # Phase 1 pass: no gap over 5 min
  coverage_gap_s: 30         # every gap longer than this is recorded for the simulator
select:
  mid_lo: 0.10
  mid_hi: 0.90
  min_days_to_close: 3
  min_program_hours_left: 24
  quote_size: 10             # contracts per side used to estimate reward share
  maker_fee_rate: 0.0175     # maker fee = rate * P * (1-P) per contract
sim:                         # Phase 2 — pre-registered in STRATEGY.md; change = version bump
  strategy_version: "1.0.0"
  quote_size: 10               # contracts per side
  stake_usd: 300               # limits scale with this
  max_loss_per_market_frac: 0.05   # worst-case loss cap per market (5% of stake)
  gamma: 0.1                   # risk aversion (log-odds, per lot of quote_size)
  vol_halflife_s: 3600         # EWMA half-life of log-odds variance
  horizon_s: 86400             # tau cap: holding horizon
  blackout_before_s: 259200    # no quotes within 3 days of close/occurrence
  reward_haircut: 0.5          # primary metric counts half the estimated reward
  markouts_s: [60, 600, 3600]  # markout horizons; settlement reported separately
  primary_markout_s: 600       # the test's markout
  bootstrap_n: 10000           # day-bootstrap resamples
  bootstrap_seed: 7
  gate_a_min_markets: 3        # Gate A: net > 0 in at least this many markets
  gate_a_min_days: 10          # ... over at least this many recorded days
  live_markets: 5              # markets the live test will quote
output:
  db_path: out/kxmm.db
  log_path: out/kxmm.log
